{% extends "layout.html" %}

{% block title %}Submit Your AI Tool - AI Exchange{% endblock %}

{% block extra_css %}
<style>
  
    
    .hero-section {
        background: 
            
            url("{{ url_for('static', filename='images/tools.png') }}") ;
        color: white;
        padding: 4rem 0 5rem;
        margin-top: 0;
        position: relative;
        overflow: hidden;
    }
    
    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
      .hero-section::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: 
            
            url("{{ url_for('static', filename='images/tools.png') }}");
        opacity: 0.2;
        z-index: 0;

    .hero-section .container {
        position: relative;
        z-index: 1;
    }

        text-align: center;
        max-width: 700px;
        margin: 0 auto;
    }
    
    .hero-title {
        font-size: 3rem;
        font-weight: 800;
        margin-bottom: 1.5rem;
        background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    
    .hero-subtitle {
        font-size: 1.35rem;
        opacity: 0.9;
        margin-bottom: 2.5rem;
        font-weight: 400;
        line-height: 1.5;
    }
    
    .free-badge {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        color: white;
        padding: 0.75rem 2rem;
        border-radius: 50px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        font-weight: 700;
        font-size: 1rem;
        display: inline-block;
        box-shadow: 
            0 8px 32px rgba(0, 0, 0, 0.15),
            inset 0 1px 2px rgba(255, 255, 255, 0.3);
        position: relative;
        overflow: hidden;
    }
    
    .free-badge::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        animation: shine 3s infinite;
    }
      @keyframes shine {
        0% { left: -100%; }
        50% { left: 100%; }
        100% { left: -100%; }
    }
    
    .india-banner {
        background: linear-gradient(135deg, #ff9933 0%, #ffffff 50%, #138808 100%);
        color: #1e293b;

        border-radius: 50px;
        font-weight: 700;
        font-size: 1.1rem;

            linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #f1f5f9 100%),

            radial-gradient(circle at 70% 80%, rgba(37, 99, 235, 0.02) 0%, transparent 50%);
        min-height: 100vh;
        position: relative;
    }
    
    .main-content::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: 
            radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 30%),
            radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.03) 0%, transparent 30%);
        pointer-events: none;
    }
    
    .content-card {
        background: rgba(255, 255, 255, 0.85);

        -webkit-backdrop-filter: blur(30px);

        box-shadow:

            0 8px 32px rgba(37, 99, 235, 0.04),
            inset 0 1px 2px rgba(255, 255, 255, 0.9);

        margin-bottom: 2.5rem;
        position: relative;
        overflow: hidden;
    }

        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;

        background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.3), transparent);
    }
    
    .benefits-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 2rem;
        margin-bottom: 3rem;
        position: relative;
        z-index: 1;
    }
    
    .benefit-item {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);

        padding: 2.5rem 2rem;
        border-radius: 20px;
        border: 2px solid rgba(255, 255, 255, 0.6);
        box-shadow: 
            0 12px 40px rgba(37, 99, 235, 0.06),
            0 4px 16px rgba(37, 99, 235, 0.04),
            inset 0 1px 2px rgba(255, 255, 255, 0.8);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }
    
    .benefit-item::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, #3b82f6, #2563eb, #1d4ed8);
        transform: scaleX(0);
        transition: transform 0.4s ease;
    }    
    .benefit-item:hover {
        transform: translateY(-5px);
        box-shadow: 
            0 20px 60px rgba(37, 99, 235, 0.12),
            0 8px 32px rgba(37, 99, 235, 0.08);
        border-color: rgba(59, 130, 246, 0.3);
    }
    
    .benefit-item:hover::before {
        transform: scaleX(1);
    }
    
    .benefit-icon {
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #1d4ed8 100%);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.75rem;
        margin: 0 auto 1.5rem;
        box-shadow: 
            0 8px 24px rgba(37, 99, 235, 0.25),
            inset 0 1px 2px rgba(255, 255, 255, 0.3);
        position: relative;
        overflow: hidden;
    }
    
    .benefit-icon::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(transparent, rgba(255, 255, 255, 0.2), transparent);
        animation: rotate 4s linear infinite;
    }
    
    @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    .benefit-title {
        font-size: 1.2rem;
        font-weight: 700;
        color: #1e293b;
        margin-bottom: 0.75rem;
        background: linear-gradient(135deg, #1e293b 0%, #475569 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    
    .benefit-desc {
        font-size: 0.95rem;
        color: #64748b;
        line-height: 1.6;
        font-weight: 400;
    }
      .form-section {
        max-width: 600px;
        margin: 0 auto;
        position: relative;
    }
    
    .form-title {
        font-size: 2rem;
        font-weight: 800;
        color: #1e293b;
        margin-bottom: 1rem;
        text-align: center;
        background: linear-gradient(135deg, #1e293b 0%, #3b82f6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    
    .form-subtitle {
        color: #64748b;
        text-align: center;
        margin-bottom: 3rem;
        font-size: 1.1rem;
        line-height: 1.6;
    }
    
    /* Enhanced Input Sections */
    .input-section {
        margin-bottom: 2.5rem;
        position: relative;
    }
    
    .input-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
    }
    
    .form-label {
        font-weight: 600;
        color: #374151;
        font-size: 1.05rem;
        margin: 0;
    }
    
    .input-icon {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1rem;
        box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
    }
    
    .input-wrapper {
        position: relative;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 16px;
        border: 2px solid rgba(59, 130, 246, 0.1);
        box-shadow: 
            0 4px 20px rgba(37, 99, 235, 0.04),
            inset 0 1px 2px rgba(255, 255, 255, 0.8);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
    }
    
    .input-wrapper:focus-within {
        border-color: #3b82f6;
        box-shadow: 
            0 0 0 4px rgba(59, 130, 246, 0.1),

            inset 0 1px 2px rgba(255, 255, 255, 0.9);
        transform: translateY(-2px);
    }
    
    .form-input {
        width: 100%;
        padding: 1.25rem 1.5rem;
        border: none;
        border-radius: 14px;
        font-size: 1rem;
        background: transparent;
        color: #374151;
        transition: all 0.3s ease;
        position: relative;
        z-index: 2;
    }
    
    .form-input:focus {
        outline: none;
        color: #1f2937;
    }
    
    .form-input::placeholder {
        color: #9ca3af;
        font-weight: 400;
    }
    
    .input-underline {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 0;
        height: 3px;
        background: linear-gradient(90deg, #3b82f6, #2563eb);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        transform: translateX(-50%);
        border-radius: 2px;
    }
    
    .input-wrapper:focus-within .input-underline {
        width: 100%;
    }
    
    .form-help {
        font-size: 0.875rem;
        color: #6b7280;
        margin-top: 0.75rem;
        font-weight: 400;
        padding-left: 0.25rem;
    }
    
    /* Enhanced Checkbox Section */
    .checkbox-section {
        margin: 3rem 0;
    }
      .custom-checkbox {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        padding: 1.5rem;
        background: rgba(248, 250, 252, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 16px;
        border: 2px solid rgba(59, 130, 246, 0.08);
        box-shadow: 0 4px 20px rgba(37, 99, 235, 0.04);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        width: 100%;
    }
    
    .custom-checkbox::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.05), transparent);
        transition: left 0.6s ease;
    }
    
    .custom-checkbox:hover::before {
        left: 100%;
    }
    
    .checkbox-input {
        display: none;
    }
    
    .checkbox-custom {
        width: 24px;
        height: 24px;
        border: 2px solid #d1d5db;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        transition: all 0.3s ease;
        cursor: pointer;
        flex-shrink: 0;
        margin-top: 0.125rem;
    }
    
    .checkbox-custom i {
        font-size: 14px;
        color: white;
        opacity: 0;
        transform: scale(0);
        transition: all 0.2s ease;
    }
    
    .checkbox-input:checked + .checkbox-custom {
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        border-color: #3b82f6;
        box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
    }
    
    .checkbox-input:checked + .checkbox-custom i {
        opacity: 1;
        transform: scale(1);
    }
      .checkbox-label {
        font-size: 0.95rem;
        color: #475569;
        line-height: 1.6;
        font-weight: 500;
        cursor: pointer;
        flex: 1;
    }
        cursor: pointer;
    }
      /* Enhanced Submit Section */
    .submit-section {
        margin-top: 3rem;
        text-align: center;
    }
    
    /* Validation Message */
    .validation-message {
        background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
        border: 1px solid #fca5a5;
        border-radius: 12px;
        padding: 1rem 1.5rem;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: #dc2626;
        font-weight: 500;
        box-shadow: 0 4px 12px rgba(220, 38, 38, 0.1);
        /* animation: shake 0.5s ease-in-out; */ /* Temporarily removed for diagnostics */
    }
    
    .validation-message i {
        font-size: 1.2rem;
        color: #dc2626;
    }
    
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
    }
    .submit-btn {
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #1d4ed8 100%);
        background-size: 200% 200%;
        color: white;
        border: none;
        padding: 0;
        border-radius: 16px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        width: 100%;
        height: 64px;
        box-shadow: 
            0 8px 32px rgba(37, 99, 235, 0.25),
            0 4px 16px rgba(37, 99, 235, 0.15),
            inset 0 1px 2px rgba(255, 255, 255, 0.3);
        position: relative;
        overflow: hidden;
    }
    
    .btn-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        height: 100%;
        position: relative;
        z-index: 2;
    }
    
    .btn-content i {
        font-size: 1.2rem;
        transition: transform 0.3s ease;
    }
    
    .btn-ripple {
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.6s ease;
    }
    
    .submit-btn:hover {
        transform: translateY(-3px);
        box-shadow: 
            0 16px 48px rgba(37, 99, 235, 0.35),
            0 8px 32px rgba(37, 99, 235, 0.25),
            inset 0 1px 2px rgba(255, 255, 255, 0.4);
        background-position: 100% 0;
    }
    
    .submit-btn:hover .btn-ripple {
        left: 100%;
    }
    
    .submit-btn:hover .btn-content i {
        transform: translateY(-2px);
    }
    
    .submit-btn:active {
        transform: translateY(-1px);
    }
      .submit-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
    }
    
    /* Mobile Responsiveness */
    @media (max-width: 768px) {
        .hero-title {
            font-size: 2.25rem;
        }
        
        .hero-subtitle {
            font-size: 1.1rem;
        }
        
        .form-section {
            padding: 0 1rem;
        }
        
        .input-header {
            flex-direction: column;
            align-items: flex-start;
            gap: 0.75rem;
        }
        
        .input-icon {
            align-self: flex-end;
        }
        
        .form-input {
            padding: 1rem 1.25rem;
            font-size: 16px; /* Prevents zoom on iOS */
        }
        
        .custom-checkbox {
            padding: 1.25rem;
            gap: 0.75rem;
        }
        
        .checkbox-label {
            font-size: 0.9rem;
        }
        
        .submit-btn {
            height: 56px;
            font-size: 1rem;
        }
        
        .benefits-grid {
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
    }
    
    @media (max-width: 480px) {
        .hero-title {
            font-size: 2rem;
        }
        
        .form-title {
            font-size: 1.75rem;
        }
        
        .input-wrapper {
            border-radius: 12px;
        }
        
        .form-input {
            border-radius: 10px;
        }
        
        .custom-checkbox {
            border-radius: 12px;
        }
          .submit-btn {
            border-radius: 12px;
        }
    }
    
    .submit-btn:hover::before {
        left: 100%;
    }
    
    .submit-btn:active {
        transform: translateY(-1px);
    }
    
    .submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.1);
    }    
    .submit-btn:disabled::before {
        display: none;
    }
    
    #loadingState.loading-state {
        display: none; /* Hide by default */
        text-align: center;
        padding: 4rem 2rem; 
        min-height: 200px; 
        color: #3b82f6;
        background: rgba(248, 250, 252, 0.95); /* Default intended background */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 20px;
        border: 2px solid rgba(59, 130, 246, 0.2);
        box-shadow: 
            0 8px 32px rgba(37, 99, 235, 0.1),
            0 4px 16px rgba(37, 99, 235, 0.05);
        margin: 2rem 0;
        position: relative; 
        z-index: 1050; 
    }
    
    /* This .show rule for the original #loadingState is now less critical 
       if the dynamic loader is the primary method, but keep for potential fallback/other uses */
    #loadingState.loading-state.show {
        display: flex !important; 
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        visibility: visible !important;
        opacity: 1 !important;
        /* Styles from base are inherited, can add overrides if needed */
    }
    
    .spinner {
        width: 48px !important; 
        height: 48px !important; 
        display: block !important; 
        border: 4px solid rgba(59, 130, 246, 0.1) !important;
        border-top: 4px solid #3b82f6 !important; /* Ensure border-top is distinct for spinning effect */
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1.5rem;
        background-color: transparent !important; 
        box-sizing: border-box !important;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    .message {
        padding: 1.5rem;
        border-radius: 16px;
        margin-top: 1.5rem;
        display: none;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    }    .message-success {
        background: rgba(220, 252, 231, 0.9);
        border: 2px solid rgba(34, 197, 94, 0.2);
        color: #065f46;
    }
    
    .message-success.show {
        display: block !important;
    }
    
    .message-error {
        background: rgba(254, 242, 242, 0.9);
        border: 2px solid rgba(239, 68, 68, 0.2);
        color: #991b1b;
    }
    
    .process-steps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.5rem;
        margin-top: 2.5rem;
    }
    
    .process-step {
        text-align: center;
        padding: 1.5rem;
        background: rgba(248, 250, 252, 0.6);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 16px;
        border: 2px solid rgba(59, 130, 246, 0.08);
        box-shadow: 0 4px 20px rgba(37, 99, 235, 0.04);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    
    .process-step:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(37, 99, 235, 0.08);
        border-color: rgba(59, 130, 246, 0.15);
    }
    
    .step-number {
        width: 48px;
        height: 48px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.2rem;
        margin: 0 auto 1rem;

            0 6px 20px rgba(37, 99, 235, 0.25),

    }
    
    .step-title {
        font-weight: 700;
        color: #1e293b;
        margin-bottom: 0.5rem;
        font-size: 1rem;
    }
    
    .step-desc {
        font-size: 0.85rem;
        color: #64748b;
        line-height: 1.5;
    }
    
    /* Mobile Responsiveness */
    @media (max-width: 768px) {
        .hero-title {
            font-size: 2.25rem;
        }
        
        .hero-subtitle {
            font-size: 1.15rem;
        }
        
        .content-card {
            padding: 2rem 1.5rem;
        }
        
        .benefits-grid {
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        
        .benefit-item {
            padding: 2rem 1.5rem;
        }
        
        .process-steps {
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        
        .checkbox-wrapper {
            padding: 1rem;
        }
    }
    
    @media (max-width: 480px) {
        .hero-section {
            padding: 3rem 0 4rem;
        }
        
        .hero-title {
            font-size: 1.875rem;
        }
        
        .hero-subtitle {
            font-size: 1rem;
        }
        
        .content-card {
            padding: 1.5rem 1rem;
        }
        
        .process-steps {
            grid-template-columns: 1fr;
        }
        
        .submit-btn {
            padding: 1rem 2rem;
            font-size: 1rem;
        }
    }
    
    .submit-btn:hover::before {
        left: 100%;
    }
    
    .submit-btn:active {
